
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flip Clock</title>
<style>
  :root{
    --bg:#FADBD8;
    --card-top:#4a3f3f;
    --card-bottom:#332b2b;
    --flap-text:#ffffff;
    --accent:#ff7f8f;
    --sub-text:#2b1f1f;
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:24px;
    transition:background .3s ease;
  }
  .widget{display:flex;flex-direction:column;align-items:center;gap:22px;}

  .clock{display:flex;align-items:flex-start;gap:14px;}

  .group{display:flex;gap:10px;}
  .unit{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .label{
    font-size:12px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--sub-text);opacity:.55;font-weight:700;
  }

  /* ---- flip card ---- */
  .flip{
    position:relative;
    width:clamp(58px,13vw,110px);
    height:clamp(80px,18vw,150px);
    perspective:1200px;
    font-variant-numeric:tabular-nums;
    filter:drop-shadow(0 10px 18px rgba(90,50,50,.28));
  }
  .flip .slot{
    position:absolute;left:0;width:100%;height:50%;
    overflow:hidden;
    display:flex;justify-content:center;
    background:var(--card-top);
  }
  .flip .slot span{
    font-size:clamp(40px,9.5vw,86px);
    line-height:0;
    font-weight:800;
    color:var(--flap-text);
    height:200%;
    display:flex;align-items:center;justify-content:center;
    width:100%;
  }
  .flip .top{
    top:0;border-radius:var(--radius) var(--radius) 0 0;
    align-items:flex-start;
  }
  .flip .top span{transform:translateY(50%);}
  .flip .bottom{
    bottom:0;border-radius:0 0 var(--radius) var(--radius);
    background:var(--card-bottom);
    align-items:flex-end;
  }
  .flip .bottom span{transform:translateY(-50%);}
  .flip .slot::after{
    content:"";position:absolute;left:0;width:100%;height:1px;
    background:rgba(0,0,0,.35);
  }
  .flip .top::after{bottom:0;}
  .flip .bottom::after{top:0;background:rgba(255,255,255,.08);}

  .flap{
    position:absolute;left:0;width:100%;height:50%;overflow:hidden;
    display:flex;justify-content:center;
    background:var(--card-top);
    z-index:5;backface-visibility:hidden;
  }
  .flap span{
    font-size:clamp(40px,9.5vw,86px);
    line-height:0;font-weight:800;color:var(--flap-text);
    height:200%;width:100%;
    display:flex;align-items:center;justify-content:center;
    color:var(--flap-text);
  }
  .flap.flap-top{
    top:0;border-radius:var(--radius) var(--radius) 0 0;
    transform-origin:bottom center;
    align-items:flex-start;
  }
  .flap.flap-top span{transform:translateY(50%);}
  .flap.flap-bottom{
    bottom:0;border-radius:0 0 var(--radius) var(--radius);
    background:var(--card-bottom);
    transform-origin:top center;
    align-items:flex-end;
  }
  .flap.flap-bottom span{transform:translateY(-50%);}
  .flip.flipping .flap-top{animation:flipTop .5s cubic-bezier(.4,.1,.3,1) forwards;}
  .flip.flipping .flap-bottom{animation:flipBottom .5s cubic-bezier(.4,.1,.3,1) forwards;}
  @keyframes flipTop{from{transform:rotateX(0)}to{transform:rotateX(-90deg)}}
  @keyframes flipBottom{from{transform:rotateX(90deg)}to{transform:rotateX(0)}}

  /* ---- colon ---- */
  .colon{
    display:flex;flex-direction:column;justify-content:center;gap:14px;
    height:clamp(80px,18vw,150px);
  }
  .colon i{
    width:clamp(7px,1.4vw,12px);height:clamp(7px,1.4vw,12px);
    border-radius:50%;background:var(--card-top);display:block;
    animation:blink 2s infinite;
  }
  @keyframes blink{0%,45%{opacity:1}50%,95%{opacity:.2}100%{opacity:1}}

  /* ---- meridiem ---- */
  .meridiem{
    display:flex;flex-direction:column;gap:6px;align-self:center;
    height:clamp(80px,18vw,150px);justify-content:center;
  }
  .meridiem button{
    font:inherit;font-weight:800;font-size:clamp(11px,2vw,16px);
    letter-spacing:.08em;border:none;border-radius:8px;
    padding:7px 11px;background:transparent;color:var(--sub-text);
    opacity:.32;cursor:pointer;transition:.25s;
  }
  .meridiem button.active{
    opacity:1;background:var(--card-top);color:#fff;
    box-shadow:0 5px 12px rgba(90,50,50,.25);
  }

  /* ---- date line ---- */
  .dateline{text-align:center;color:var(--sub-text);}
  .dateline .day{
    font-size:clamp(20px,4vw,34px);font-weight:800;letter-spacing:.06em;
    text-transform:uppercase;line-height:1.1;
  }
  .dateline .date{
    font-size:clamp(14px,2.6vw,22px);font-weight:600;
    letter-spacing:.04em;margin-top:4px;opacity:.85;
  }

  /* ---- settings ---- */
  .gear{
    position:fixed;top:18px;right:18px;width:44px;height:44px;border-radius:50%;
    border:none;background:var(--card-top);color:#fff;font-size:20px;
    cursor:pointer;box-shadow:0 6px 16px rgba(90,50,50,.3);z-index:30;
  }
  .panel{
    position:fixed;top:0;right:0;height:100%;width:min(320px,88vw);
    background:#fff;box-shadow:-10px 0 30px rgba(90,50,50,.25);
    transform:translateX(105%);transition:transform .35s ease;z-index:40;
    padding:26px 22px;overflow-y:auto;
  }
  .panel.open{transform:translateX(0);}
  .panel h2{font-size:17px;color:#2b1f1f;margin-bottom:18px;letter-spacing:.02em;}
  .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;}
  .row label{font-size:13px;color:#3d2f2f;font-weight:600;}
  .row input[type=color]{
    width:46px;height:30px;border:1px solid #ddd;border-radius:8px;
    background:none;cursor:pointer;padding:2px;
  }
  .row select{
    font:inherit;font-size:13px;padding:6px 8px;border-radius:8px;
    border:1px solid #ddd;background:#fff;color:#2b1f1f;cursor:pointer;
  }
  .row input[type=range]{width:110px;accent-color:var(--accent);}
  .swatch{width:32px;height:32px;border-radius:8px;border:1px solid #eee;cursor:pointer;}
  .presets{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 18px;}
  .close{
    width:100%;margin-top:10px;padding:11px;border:none;border-radius:10px;
    background:var(--card-top);color:#fff;font:inherit;font-weight:700;
    cursor:pointer;letter-spacing:.04em;
  }
  .divider{height:1px;background:#f0e4e4;margin:18px 0;}

  @media (max-width:560px){
    .clock{gap:8px;}
    .group{gap:6px;}
    .meridiem button{padding:5px 7px;}
  }
</style>
</head>
<body>

<button class="gear" id="gear" title="Customise">&#9881;</button>

<div class="widget">
  <div class="clock" id="clock">
    <div class="unit">
      <div class="group">
        <div class="flip" id="h1"></div>
        <div class="flip" id="h2"></div>
      </div>
      <span class="label">Hour</span>
    </div>

    <div class="colon"><i></i><i></i></div>

    <div class="unit">
      <div class="group">
        <div class="flip" id="m1"></div>
        <div class="flip" id="m2"></div>
      </div>
      <span class="label">Minutes</span>
    </div>

    <div class="unit">
      <div class="group">
        <div class="flip" id="s1"></div>
        <div class="flip" id="s2"></div>
      </div>
      <span class="label">Seconds</span>
    </div>

    <div class="meridiem">
      <button data-m="AM">AM</button>
      <button data-m="PM">PM</button>
    </div>
  </div>

  <div class="dateline">
    <div class="day" id="day">—</div>
    <div class="date" id="date">—</div>
  </div>
</div>

<aside class="panel" id="panel">
  <h2>Customise</h2>

  <div class="row"><label>Background</label><input type="color" id="c-bg" value="#FADBD8"></div>
  <div class="row"><label>Flap (top)</label><input type="color" id="c-top" value="#4a3f3f"></div>
  <div class="row"><label>Flap (bottom)</label><input type="color" id="c-bottom" value="#332b2b"></div>
  <div class="row"><label>Digit colour</label><input type="color" id="c-text" value="#ffffff"></div>
  <div class="row"><label>Text colour</label><input type="color" id="c-sub" value="#2b1f1f"></div>
  <div class="row"><label>Accent</label><input type="color" id="c-accent" value="#ff7f8f"></div>

  <div class="divider"></div>
  <div class="row">
    <label>Preset</label>
    <div class="presets">
      <div class="swatch" data-preset="pink" style="background:linear-gradient(135deg,#FADBD8,#ff9aa8)"></div>
      <div class="swatch" data-preset="mint" style="background:linear-gradient(135deg,#D8F3EE,#7fd6c4)"></div>
      <div class="swatch" data-preset="lavender" style="background:linear-gradient(135deg,#E6DEF7,#b9a7ea)"></div>
      <div class="swatch" data-preset="dark" style="background:linear-gradient(135deg,#2b2b33,#111)"></div>
      <div class="swatch" data-preset="cream" style="background:linear-gradient(135deg,#FFF3E0,#e6c9a8)"></div>
    </div>
  </div>

  <div class="row">
    <label>Format</label>
    <select id="s-format">
      <option value="12" selected>12-hour</option>
      <option value="24">24-hour</option>
    </select>
  </div>
  <div class="row">
    <label>Show seconds</label>
    <select id="s-secs"><option value="1" selected>Yes</option><option value="0">No</option></select>
  </div>
  <div class="row">
    <label>Show labels</label>
    <select id="s-labels"><option value="1" selected>Yes</option><option value="0">No</option></select>
  </div>
  <div class="row"><label>Flip speed</label><input type="range" id="s-speed" min="200" max="900" step="50" value="500"></div>
  <div class="row"><label>Corner round</label><input type="range" id="s-radius" min="0" max="30" step="1" value="16"></div>
  <div class="row">
    <label>Date style</label>
    <select id="s-datestyle">
      <option value="long" selected>Long</option>
      <option value="medium">Medium</option>
      <option value="numeric">Numeric</option>
    </select>
  </div>
  <div class="row">
    <label>Day case</label>
    <select id="s-daycase"><option value="upper" selected>UPPERCASE</option><option value="title">Title Case</option></select>
  </div>

  <button class="close" id="close">Done</button>
</aside>

<script>
(function(){
  const root = document.documentElement;

  function buildFlip(el){
    el.innerHTML =
      '<div class="slot top"><span>0</span></div>' +
      '<div class="slot bottom"><span>0</span></div>' +
      '<div class="flap flap-top"><span>0</span></div>' +
      '<div class="flap flap-bottom"><span>0</span></div>';
    return {
      el,
      cur: '0',
      next: '0',
      top: el.querySelector('.slot.top span'),
      bottom: el.querySelector('.slot.bottom span'),
      flapTop: el.querySelector('.flap-top span'),
      flapBottom: el.querySelector('.flap-bottom span'),
      ft: el.querySelector('.flap-top'),
      fb: el.querySelector('.flap-bottom')
    };
  }

  const ids = ['h1','h2','m1','m2','s1','s2'];
  const flips = {};
  ids.forEach(id => flips[id] = buildFlip(document.getElementById(id)));

  let flipSpeed = 500;

  function setDigit(id, val){
    val = String(val);
    const f = flips[id];
    if(f.cur === val) return;

    // static backing layers show the NEW value underneath
    f.top.textContent = f.cur;
    f.bottom.textContent = val;

    // flaps animate: top carries OLD value, bottom shows NEW value
    f.flapTop.textContent = f.cur;
    f.flapBottom.textContent = val;

    f.el.classList.remove('flipping');
    void f.el.offsetWidth;
    f.el.style.setProperty('--flip-speed', flipSpeed + 'ms');
    f.el.classList.add('flipping');

    f.cur = val;

    clearTimeout(f._t);
    f._t = setTimeout(() => {
      f.el.classList.remove('flipping');
      f.top.textContent = val;
      f.bottom.textContent = val;
      f.flapTop.textContent = val;
      f.flapBottom.textContent = val;
    }, flipSpeed + 20);
  }

  const dayEl = document.getElementById('day');
  const dateEl = document.getElementById('date');
  const meridiemBtns = document.querySelectorAll('.meridiem button');
  const colon = document.querySelector('.colon');

  let format = '12';
  let showSecs = true;
  let showLabels = true;
  let dateStyle = 'long';
  let dayCase = 'upper';

  function greet(h){
    return h < 12 ? 'AM' : 'PM';
  }

  function tick(){
    const now = new Date();
    let h = now.getHours();
    const m = now.getMinutes();
    const s = now.getSeconds();
    const mer = greet(h);

    if(format === '12'){
      let h12 = h % 12; if(h12 === 0) h12 = 12;
      setDigit('h1', Math.floor(h12/10));
      setDigit('h2', h12 % 10);
    } else {
      setDigit('h1', Math.floor(h/10));
      setDigit('h2', h % 10);
    }
    setDigit('m1', Math.floor(m/10));
    setDigit('m2', m % 10);

    if(showSecs){
      setDigit('s1', Math.floor(s/10));
      setDigit('s2', s % 10);
    }

    meridiemBtns.forEach(b => {
      const isActive = format === '12' && b.dataset.m === mer;
      b.classList.toggle('active', isActive);
      b.style.visibility = format === '12' ? 'visible' : 'hidden';
    });

    // date line
    let dayTxt = now.toLocaleDateString(undefined, {weekday:'long'});
    if(dayCase === 'upper') dayTxt = dayTxt.toUpperCase();
    dayEl.textContent = dayTxt;

    let opts;
    if(dateStyle === 'long')    opts = {day:'numeric', month:'long', year:'numeric'};
    if(dateStyle === 'medium')  opts = {day:'numeric', month:'short', year:'numeric'};
    if(dateStyle === 'numeric') opts = {day:'2-digit', month:'2-digit', year:'numeric'};
    dateEl.textContent = now.toLocaleDateString(undefined, opts);
  }

  // ---------- settings wiring ----------
  const $ = id => document.getElementById(id);

  function applyTheme(o){
    if(o.bg)     root.style.setProperty('--bg', o.bg);
    if(o.top)    root.style.setProperty('--card-top', o.top);
    if(o.bottom) root.style.setProperty('--card-bottom', o.bottom);
    if(o.text)   root.style.setProperty('--flap-text', o.text);
    if(o.sub)    root.style.setProperty('--sub-text', o.sub);
    if(o.accent) root.style.setProperty('--accent', o.accent);
  }

  $('c-bg').oninput      = e => applyTheme({bg:e.target.value});
  $('c-top').oninput     = e => applyTheme({top:e.target.value});
  $('c-bottom').oninput  = e => applyTheme({bottom:e.target.value});
  $('c-text').oninput    = e => applyTheme({text:e.target.value});
  $('c-sub').oninput     = e => applyTheme({sub:e.target.value});
  $('c-accent').oninput  = e => applyTheme({accent:e.target.value});

  const presets = {
    pink:     {bg:'#FADBD8', top:'#4a3f3f', bottom:'#332b2b', text:'#ffffff', sub:'#2b1f1f', accent:'#ff7f8f'},
    mint:     {bg:'#D8F3EE', top:'#2f4f48', bottom:'#1f3833', text:'#ffffff', sub:'#1f3a34', accent:'#3fbfa3'},
    lavender: {bg:'#E6DEF7', top:'#453a63', bottom:'#2f2745', text:'#ffffff', sub:'#302a45', accent:'#8f79d8'},
    dark:     {bg:'#1b1b20', top:'#3a3a44', bottom:'#26262e', text:'#ffffff', sub:'#f2f2f5', accent:'#ff7f8f'},
    cream:    {bg:'#FFF3E0', top:'#6b5a46', bottom:'#4d4033', text:'#ffffff', sub:'#3d3226', accent:'#d9a25f'}
  };

  document.querySelectorAll('.swatch').forEach(sw => {
    sw.onclick = () => {
      const p = presets[sw.dataset.preset];
      applyTheme(p);
      $('c-bg').value = p.bg; $('c-top').value = p.top;
      $('c-bottom').value = p.bottom; $('c-text').value = p.text;
      $('c-sub').value = p.sub; $('c-accent').value = p.accent;
    };
  });

  $('s-format').onchange = e => { format = e.target.value; colon.childNodes; };
  $('s-secs').onchange   = e => {
    showSecs = e.target.value === '1';
    document.querySelectorAll('#s1,#s2').forEach(el => {
      const u = el.closest('.unit');
      u.style.display = showSecs ? 'flex' : 'none';
      const cm = el.closest('.unit').previousElementSibling;
      if(cm && cm.classList.contains('colon')) cm.style.display = showSecs ? 'flex' : 'none';
    });
    // hide the second colon separator too
    const colons = document.querySelectorAll('.colon');
    if(colons[1]) colons[1].style.display = showSecs ? 'flex' : 'none';
  };
  $('s-labels').onchange = e => {
    showLabels = e.target.value === '1';
    document.querySelectorAll('.label').forEach(l => l.style.visibility = showLabels ? 'visible' : 'hidden');
  };
  $('s-speed').oninput   = e => { flipSpeed = +e.target.value; document.querySelectorAll('.flip').forEach(f => f.style.setProperty('--flip-speed', flipSpeed+'ms')); };
  $('s-radius').oninput  = e => root.style.setProperty('--radius', e.target.value + 'px');
  $('s-datestyle').onchange = e => dateStyle = e.target.value;
  $('s-daycase').onchange   = e => dayCase = e.target.value;

  const panel = $('panel');
  $('gear').onclick  = () => panel.classList.add('open');
  $('close').onclick = () => panel.classList.remove('open');

  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
